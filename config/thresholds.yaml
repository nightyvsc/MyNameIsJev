# AVISO: este archivo conserva la propuesta original v0.1. Sus valores no los
# carga el runtime v2.0; el espejo actual está en config/thresholds.v2.yaml y
# la fuente que sí consume el gateway es docs/policy.defaults.json.
# Action Classes, Risk Levels & Thresholds
# Version: 0.1.0
# These are runtime-configurable parameters. No redeployment needed to change them.
# All threshold values use NIST SP 800-53 / ISO 27001 / Microsoft DLP baselines
# adapted to a 30X-scale organisation.

# ---------------------------------------------------------------------------
# FAIL POLICY
# ---------------------------------------------------------------------------
# What to do when JEV is unreachable (timeout or API error).
# Options: do_nothing (action stays 'pending' until TTL) | deny_all
fail_policy: do_nothing
pending_ttl_seconds: 300      # After this, pending actions are auto-denied.
jev_timeout_seconds: 10
jev_max_retries: 2
jev_retry_backoff_seconds: 1.5

# ---------------------------------------------------------------------------
# JEV MODEL
# ---------------------------------------------------------------------------
jev_model: "jev-1.14"
jev_base_url: "https://api.typesafe.ai/v1/systemone"

# ---------------------------------------------------------------------------
# ACTION CLASSES
# ---------------------------------------------------------------------------
# Each class defines:
#   reversible: bool  (if false → stricter thresholds)
#   questions:  path to the JEV question set for this class
#   thresholds: per-level rules that map extractor + JEV output → verdict
#   deny_immediately: list of conditions that auto-deny before JEV is called

action_classes:

  # ── Correo masivo ────────────────────────────────────────────────────────
  mass_communication:
    reversible: false
    questions_file: "config/questions/mass_communication.yaml"
    deny_immediately:
      - condition: "recipients.total_count > 1000"
        reason_code: "RECIPIENT_COUNT_CRITICAL"
      - condition: "pii_flags.contains_credit_card == true"
        reason_code: "PII_CRITICAL_FIELD"
      - condition: "pii_flags.contains_iban == true"
        reason_code: "PII_CRITICAL_FIELD"
    thresholds:
      # Deterministic thresholds (before JEV)
      recipient_count:
        low:      { max: 9,    verdict_hint: allow  }
        medium:   { max: 249,  verdict_hint: ask    }
        high:     { max: 999,  verdict_hint: ask    }
        critical: { min: 1000, verdict_hint: deny   }   # Caught by deny_immediately above
      # JEV probability thresholds
      jev:
        content_is_misleading:          { block_above: 0.70 }
        content_contains_pii:           { ask_above: 0.60, block_above: 0.85 }
        content_is_off_brand:           { ask_above: 0.65 }
        action_is_irreversible:         { ask_above: 0.50 }   # Always true for email, used as sanity check
        risk_level_critical:            { block_above: 0.80 }

  # ── Escritura en CRM ─────────────────────────────────────────────────────
  crm_write:
    reversible: true
    questions_file: "config/questions/crm_write.yaml"
    deny_immediately:
      - condition: "pii_flags.contains_credit_card == true"
        reason_code: "PII_CRITICAL_FIELD"
    thresholds:
      recipient_count:     # recipient_count = records affected
        low:      { max: 9,    verdict_hint: allow }
        medium:   { max: 499,  verdict_hint: ask   }
        high:     { min: 500,  verdict_hint: deny  }
      jev:
        content_contains_pii:       { ask_above: 0.65, block_above: 0.90 }
        content_is_misleading:      { block_above: 0.75 }
        risk_level_critical:        { block_above: 0.80 }

  # ── Post en red social ───────────────────────────────────────────────────
  social_post:
    reversible: true          # Posts can be deleted
    questions_file: "config/questions/social_post.yaml"
    deny_immediately: []      # No auto-deny; always goes to JEV
    thresholds:
      jev:
        content_contains_pii:        { block_above: 0.80 }
        content_is_misleading:       { block_above: 0.70 }
        content_is_off_brand:        { ask_above: 0.60   }
        content_is_inflammatory:     { block_above: 0.75 }
        risk_level_critical:         { block_above: 0.80 }

  # ── Merge de Pull Request ─────────────────────────────────────────────────
  repo_merge:
    reversible: false         # Merge to main is irreversible in intent
    questions_file: "config/questions/repo_operations.yaml"
    deny_immediately:
      - condition: "diff_stats.touches_secrets == true"
        reason_code: "TOUCHES_SECRETS"
      - condition: "diff_stats.files_changed > 50"
        reason_code: "DIFF_SIZE_EXCESSIVE"
    thresholds:
      jev:
        contains_secret_leak:             { block_above: 0.75 }
        introduces_security_vulnerability: { block_above: 0.75 }
        has_breaking_api_change:           { ask_above: 0.65  }
        adds_unreviewed_dependency:        { ask_above: 0.60  }
        severity_score_critical:           { block_above: 0.80 }
        review_action_request_changes:     { ask_above: 0.70  }
        review_action_flag_security:       { block_above: 0.65 }

  # ── Push directo a main ───────────────────────────────────────────────────
  repo_push_main:
    reversible: false
    questions_file: "config/questions/repo_operations.yaml"
    deny_immediately:
      - condition: "true"         # Always deny a direct push to main without exception
        reason_code: "DIRECT_PUSH_TO_MAIN_PROHIBITED"
    thresholds: {}               # Never reaches JEV; deny_immediately catches all

  # ── Modificación de CI / secretos ────────────────────────────────────────
  repo_ci_secrets:
    reversible: false
    questions_file: "config/questions/repo_operations.yaml"
    deny_immediately:
      - condition: "diff_stats.touches_secrets == true"
        reason_code: "TOUCHES_SECRETS"
    thresholds:
      jev:
        contains_secret_leak:             { block_above: 0.60 }
        introduces_security_vulnerability: { block_above: 0.65 }
        severity_score_critical:           { block_above: 0.70 }
        review_action_flag_security:       { block_above: 0.60 }
    default_verdict_if_reaches_policy: ask   # All CI changes need at minimum human review

  # ── Agregar dependencia ───────────────────────────────────────────────────
  repo_add_dependency:
    reversible: true
    questions_file: "config/questions/repo_operations.yaml"
    deny_immediately: []
    thresholds:
      jev:
        adds_unreviewed_dependency:        { ask_above: 0.55  }
        introduces_security_vulnerability: { block_above: 0.70 }
        severity_score_critical:           { block_above: 0.75 }

  # ── Borrar archivos ───────────────────────────────────────────────────────
  repo_delete_files:
    reversible: false
    questions_file: "config/questions/repo_operations.yaml"
    deny_immediately:
      - condition: "diff_stats.files_changed > 5"
        reason_code: "BULK_DELETE_EXCESSIVE"
    thresholds:
      jev:
        introduces_security_vulnerability: { block_above: 0.70 }
        severity_score_critical:           { block_above: 0.75 }
      files_changed:
        low:    { max: 1, verdict_hint: allow }
        medium: { max: 5, verdict_hint: ask   }
        high:   { min: 6, verdict_hint: deny  }    # Caught by deny_immediately

# ---------------------------------------------------------------------------
# GLOBAL VERDICT RESOLUTION ORDER
# ---------------------------------------------------------------------------
# When multiple reasons conflict, the most severe wins:
#   deny > ask > allow
# A single 'block' reason is sufficient to deny regardless of other signals.

# ---------------------------------------------------------------------------
# HIGH-RISK ROLES
# ---------------------------------------------------------------------------
# Recipients in these roles trigger includes_high_risk_roles = true,
# which raises the verdict to at minimum 'ask' for any action class.
high_risk_roles:
  - "ceo"
  - "cto"
  - "cfo"
  - "ciso"
  - "vp_finance"
  - "vp_engineering"
  - "hr_director"
  - "legal"
  - "board"

# ---------------------------------------------------------------------------
# IMPLEMENTACIÓN ACTUAL v2.0
# ---------------------------------------------------------------------------
# El runtime de Persona A carga la política v2 desde docs/policy.defaults.json.
# El espejo legible completo de esa política está en config/thresholds.v2.yaml.
# Las reglas históricas de arriba se conservan sin borrarlas y no se consumen
# por el gateway v2.0.
contract_v2:
  mirror: config/thresholds.v2.yaml
  canonical_runtime_config: docs/policy.defaults.json
