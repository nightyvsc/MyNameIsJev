services:
  gateway:
    build:
      context: ..
      dockerfile: src/jev_gate/gateway/Dockerfile
    ports:
      - "${VM1_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-8000}:8000"
    environment:
      GATE_TOKEN: "${GATE_TOKEN:?GATE_TOKEN must be set in VM1 .env}"
      TYPESAFE_API_KEY: "${TYPESAFE_API_KEY:-}"
      JEV_BASE_URL: "${JEV_BASE_URL:-https://api.typesafe.ai/v1/systemone}"
      JEV_MODEL: "${JEV_MODEL:-jev-latest}"
      JEV_GATE_DB: /var/lib/jev-gate/audit.sqlite3
      JEV_GATE_POLICY: /app/docs/policy.defaults.json
      JEV_GATE_QUESTIONS: /app/docs/jev_questions.json
      PORT: "8000"
    volumes:
      - gateway_data:/var/lib/jev-gate
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  gateway_data:
