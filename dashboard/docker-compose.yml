services:
  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    ports:
      - "${VM2_BIND_IP:-127.0.0.1}:${DASHBOARD_PORT:-3000}:3000"
    environment:
      GATEWAY_BASE_URL: "${GATEWAY_BASE_URL:-http://127.0.0.1:8000}"
      GATE_TOKEN: "${GATE_TOKEN:-}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/_stcore/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
